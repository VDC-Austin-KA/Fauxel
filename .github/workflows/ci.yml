name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  capture-ingestion:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/capture-ingestion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: pytest -q
