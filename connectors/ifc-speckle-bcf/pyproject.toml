[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fauxel-openbim"
version = "0.1.0"
description = "OpenBIM connectors for Fauxel: BCF 2.1/3.0 import + BCF 2.1 export, Speckle (specklepy) receive and progress-colored send"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
speckle = ["specklepy[bundle]>=2026.9"]   # Apache-2.0; installs on Python 3.13 (verified)
test = ["pytest>=8", "lxml>=5"]

[tool.setuptools.packages.find]
include = ["fauxel_openbim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: downloads the buildingSMART XSDs"]
