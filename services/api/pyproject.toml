[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fauxel-api"
version = "0.1.0"
description = "Fauxel backend API: BIM ingest, 360 capture, projection + CV fusion, progress analytics, write-back"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "psycopg[binary,pool]>=3.1",
  "boto3>=1.34",
  "ifcopenshell>=0.8",
  "numpy>=1.24",
  "scipy>=1.10",
  "opencv-python-headless>=4.8",
  "jsonschema>=4.18",
  "pydantic>=2",
  "shapely>=2.0",
]

[project.optional-dependencies]
kafka = ["confluent-kafka>=2.3"]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["fauxel_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["engines: needs the vision/analytics/qc engine modules (skipped when they cannot be imported)", "network: needs internet"]
