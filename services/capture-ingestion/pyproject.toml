[project]
name = "fauxel-capture"
version = "0.1.0"
description = "Fauxel capture ingestion: equirect projection, AprilTag localization, Sim(3)/SE(3) BIM alignment"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "opencv-python-headless>=4.8"]

[project.optional-dependencies]
apriltag = ["pupil-apriltags>=1.0"]
test = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
