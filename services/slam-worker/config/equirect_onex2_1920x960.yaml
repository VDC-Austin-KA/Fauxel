# stella_vslam equirectangular camera for the Insta360 ONE X2 (stitched equirect export, 1920x960).
# Equirectangular projection is resolution independent: poses from the 1920x960 variant are the same frame.
Camera:
  name: "Insta360 ONE X2 1920x960"
  setup: "monocular"
  model: "equirectangular"

  fps: 30.0
  cols: 1920
  rows: 960

  color_order: "RGB"

Preprocessing:
  min_size: 800
  # Mask the poles (stitch seam, ceiling lights smear, selfie stick / photographer at the nadir): [x0, x1, y0, y1] fractions
  mask_rectangles:
    - [0.0, 1.0, 0.0, 0.08]
    - [0.0, 1.0, 0.90, 1.0]

Feature:
  name: "ORB, 360 interiors"
  scale_factor: 1.2
  num_levels: 8
  ini_fast_threshold: 20
  min_fast_threshold: 7

Mapping:
  backend: "g2o"
  baseline_dist_thr_ratio: 0.02
  redundant_obs_ratio_thr: 0.95
  num_covisibilities_for_landmark_generation: 20
  num_covisibilities_for_landmark_fusion: 20
  residual_deg_thr: 0.4

Tracking:
  backend: "g2o"

LoopDetector:
  backend: "g2o"
  enabled: true
  reject_by_graph_distance: true
  min_distance_on_graph: 50

GraphOptimizer:
  min_num_shared_lms: 200

GlobalOptimizer:
  thr_neighbor_keyframes: 100

System:
  map_format: "msgpack"
  num_grid_cols: 96
  num_grid_rows: 48
